services:
    postgres:
        image: postgres:16
        container_name: inventory_sales_pg
        restart: unless-stopped
        environment:
            POSTGRES_DB: inventory_sales
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: secret
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data

volumes:
    pgdata:

